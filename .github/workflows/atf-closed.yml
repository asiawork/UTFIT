name: ATF compare closed funds

# NAV ของกองที่ปิดไปแล้ว (pipelines/atf-compare/closed_funds.csv) ดึงครั้งเดียวต่อกอง สำหรับหน้า atf/compare
on:
  push:
    branches: [main]
    paths: ["pipelines/atf-compare/closed_funds.csv"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atf-closed

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests
      - name: Fetch closed funds
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python pipelines/atf-compare/scripts/fetch_closed.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atf/compare/data/closed
          if ! git diff --staged --quiet; then
            git commit -q -m "ATF compare closed funds $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
