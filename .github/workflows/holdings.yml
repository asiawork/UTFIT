name: Fund holdings data

# พอร์ตกองทุนไทย (SEC) สำหรับหน้า "หุ้นนี้กองไหนถือ" (funds/holdings/)
on:
  push:
    branches: [main]
    paths: ["pipelines/holdings/*.py", ".github/workflows/holdings.yml"]
  schedule:
    # ทุกวันที่ 20 ของเดือน 07:17 เวลาไทย (factsheet/พอร์ตรายไตรมาสออกหลังสิ้นไตรมาสราว 1–2 เดือน)
    - cron: "17 0 20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests
      - name: Fetch from SEC
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipelines/holdings/fetch_sec.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipelines/holdings/data
          if ! git diff --staged --quiet; then
            git commit -q -m "Fund holdings data $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs origin main
            git push
          fi
