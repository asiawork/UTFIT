name: Master fund data

# ข้อมูลกองทุนไทย + master fund สำหรับหน้า "ค้นหาด้วย Master Fund" (funds/masterfund/)
on:
  # รันเมื่อกดปุ่ม Run workflow ในแท็บ Actions เท่านั้น
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run data fetch script
        working-directory: funds/masterfund     # สคริปต์เขียน funds_data.json / policy_data.json ลงโฟลเดอร์ที่รัน
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python ../../pipelines/masterfund/fetch_funds.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds/masterfund/funds_data.json funds/masterfund/policy_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Master fund data $(date '+%Y-%m-%d')"
            git pull --rebase -X theirs origin main
            git push
          fi
