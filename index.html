<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTFIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/utfit.css">
<script src="shared/nav.js"></script>
<script src="shared/atf-store.js"></script>
<script src="shared/ui.js"></script>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>เครื่องมือทีม Mutual Fund</h1>
    <div class="meta" id="meta"></div>
  </section>

  <div class="cats">
    <a class="cat" href="atf/">
      <div class="top"><h2>Auto Top Funds</h2><span class="go" data-i="arrow"></span></div>
      <ul>
        <li>Wealth Solution Plan</li>
        <li>เปรียบเทียบ Auto Top Funds กับกองทุน</li>
      </ul>
    </a>
    <a class="cat" href="funds/">
      <div class="top"><h2>รายกองทุน</h2><span class="go" data-i="arrow"></span></div>
      <ul>
        <li>กราฟ Weekly</li>
        <li>ค้นหาด้วย Master Fund</li>
      </ul>
    </a>
  </div>

  <footer class="foot">UTFIT</footer>
</main>
<script>
document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = UI.icon(e.dataset.i));
(async () => {
  const [nav, wk, file] = await Promise.all([UI.navIndex(""), UI.weekly(""), UI.atfFile()]);
  const m = [];
  if (nav) m.push(`NAV ล่าสุด <b>${UI.thDate(nav.navTo)}</b>`);
  if (wk) m.push(`กราฟ Weekly <b>${UI.thDate(wk.updated)}</b>`);
  m.push(file ? `ไฟล์ Model Performance <b>พร้อมใช้</b>` : `ไฟล์ Model Performance <b>ยังไม่มีในเครื่องนี้</b>`);
  document.getElementById("meta").innerHTML = m.map(x => `<span>${x}</span>`).join("");
})();
</script>
</body>
</html>
