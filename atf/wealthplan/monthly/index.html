<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>รายงานประจำเดือน Wealth Solution Plan</title>
<link rel="stylesheet" href="../../../shared/utfit.css">
<style>
  .mh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:44px 0 20px;flex-wrap:wrap}
  .mh h1{font-size:40px;line-height:1.15;letter-spacing:-.02em}
  .mh .sub{margin-top:8px;color:#6b7290;font-size:15px}
  .mh .sub b{color:#0f1a3c;font-weight:600}
  .go{display:inline-flex;align-items:center;gap:10px;background:#0f1a3c;color:#fff;border:0;border-radius:14px;padding:14px 22px;
      font:600 16px var(--head);cursor:pointer;box-shadow:0 6px 18px rgba(15,26,60,.18);transition:background .15s,transform .15s}
  .go:hover:not(:disabled){background:#2f56ff;transform:translateY(-1px)}
  .go:disabled{opacity:.45;cursor:default}
  .gos{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .go.alt{background:#fff;color:#0f1a3c;box-shadow:inset 0 0 0 1.5px #0f1a3c}
  .go.alt:hover:not(:disabled){background:#f3f5fb;color:#0f1a3c}
  .go svg{width:18px;height:18px}
  .msg{margin-top:8px;font-size:13.5px;color:#6b7290;text-align:right;min-height:20px}
  .empty{border:1.5px dashed #d5daea;border-radius:18px;padding:40px;text-align:center;color:#6b7290;margin:20px 0 60px}
  .empty a{color:#2f56ff;font-weight:600}
  .pick{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:#6b7290}
  .pick select{font:600 15px var(--head);color:#0f1a3c;border:1.5px solid #d5daea;border-radius:10px;padding:7px 10px;background:#fff;cursor:pointer}
  .pick select:disabled{opacity:.5}
  #view{width:100%;border:0;display:block;margin-bottom:60px;min-height:400px}
</style>
</head>
<body>
<script src="../../../shared/nav.js" data-section="atf" data-title="รายงานประจำเดือน"></script>
<main class="wrap">
  <div class="mh">
    <div>
      <h1>รายงานประจำเดือน<br>Wealth Solution Plan</h1>
      <div class="sub" id="sub">กำลังโหลดข้อมูล…</div>
      <label class="pick" hidden id="pickWrap">ข้อมูลถึง <select id="endSel"></select></label>
    </div>
    <div>
      <div class="gos"><button class="go" id="go" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M3.5 12.5v3h13v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>ดาวน์โหลด PowerPoint</button>
      <button class="go alt" id="go10" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M3.5 12.5v3h13v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>พื้นขาว 10 ล้านบาท</button></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="empty" id="empty" hidden>ยังไม่มีไฟล์ Model Performance ในเบราว์เซอร์นี้ อัปโหลดได้ที่หน้า <a href="../../">Auto Top Funds</a></div>
  <iframe id="view" title="ตัวอย่างสไลด์"></iframe>
</main>
<script>
/* หน้านี้ไม่มีลิงก์จากหน้าอื่น ใช้คนเดียว
   ใช้โค้ดคำนวณและวาดสไลด์ของหน้า Wealth Solution Plan (โหลดไว้ใน iframe) ตัวเลขจึงตรงกับหน้าที่ทีมใช้เสมอ
   ได้ไฟล์เดียว 20 สไลด์ 4 section: TH (ไทย กรมท่า) › EN (อังกฤษ กรมท่า) › P (ไทย ขาว) › ENP (อังกฤษ ขาว) แต่ละชุด แผน 1–5 */
const VERSIONS = [
  {lang: 'th', theme: 'navy',  label: 'TH',  desc: 'ไทย พื้นกรมท่า'},
  {lang: 'en', theme: 'navy',  label: 'EN',  desc: 'อังกฤษ พื้นกรมท่า'},
  {lang: 'th', theme: 'white', label: 'P',   desc: 'ไทย พื้นขาว'},
  {lang: 'en', theme: 'white', label: 'ENP', desc: 'อังกฤษ พื้นขาว'},
];
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate = s => `${+s.slice(8,10)} ${TH_MON[+s.slice(5,7)-1]} ${+s.slice(0,4) + 543 - 2500}`;
const $ = id => document.getElementById(id);
const frame = $('view');
let W, D, ITEMS = [];

function waitReady(){
  return new Promise(res => {
    const t0 = Date.now();
    (function tick(){
      W = frame.contentWindow; D = frame.contentDocument;
      const api = W && W.WPAPI;
      if (api && (api.ready() || Date.now() - t0 > 6000)) return res(api);
      setTimeout(tick, 150);
    })();
  });
}

/* ตัวเลือกวันสิ้นสุด: ข้อมูลล่าสุด หรือวันทำการสุดท้ายของแต่ละเดือนที่จบแล้ว (12 เดือนย้อนหลัง)
   ค่าเริ่มต้น = สิ้นเดือนล่าสุดที่จบแล้ว */
function endOptions(api){
  const ds = api.dates(), last = ds[ds.length - 1], byMon = {};
  ds.forEach(d => { if (d >= api.SLIDE_PERIOD.start) byMon[d.slice(0, 7)] = d; });
  const ends = Object.keys(byMon).filter(m => m < last.slice(0, 7)).sort().reverse().slice(0, 12).map(m => byMon[m]);
  const sel = $('endSel');
  sel.innerHTML = `<option value="${last}">ล่าสุด ${thDate(last)}</option>` +
    ends.map(d => `<option value="${d}">สิ้นเดือน ${thDate(d)}</option>`).join('');
  if (ends.length) sel.value = ends[0];
  $('pickWrap').hidden = false;
}

function setup(api){
  // ซ่อนหน้าเดิมทั้งหมด เหลือแค่สไลด์ตัวอย่าง
  const css = D.createElement('style');
  css.textContent = `html,body{background:#fff!important;margin:0!important;padding:0!important}
    body > *:not(#mroot){display:none!important}
    #mroot{display:block;padding:4px 2px 2px}
    #mroot h3{font:600 15px var(--head);color:#0f1a3c;margin:26px 0 10px}
    #mroot h3:first-child{margin-top:0}
    #mroot h3 span{font-weight:400;color:#6b7290;margin-left:8px}
    #mroot .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    #mroot .cell{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;border:1px solid #e3e6ef}
    #mroot .cell .slide{position:absolute;left:0;top:0}`;
  D.head.appendChild(css);
  const root = D.createElement('div'); root.id = 'mroot'; D.body.appendChild(root);
  W.addEventListener('resize', scale);
  endOptions(api);
  $('endSel').onchange = () => build(api);
  build(api);
}
function scale(){
  ITEMS.forEach(it => { it.el.style.transform = `scale(${it.el.parentNode.clientWidth / 1280})`; });
  frame.style.height = D.documentElement.scrollHeight + 'px';
}

function build(api){
  const root = D.getElementById('mroot'); root.innerHTML = '';

  const st = api.state;
  st.start = api.SLIDE_PERIOD.start; st.end = $('endSel').value || api.lastDate(); st.amount = '';
  const plans = api.PLANS.filter(p => p.no);
  ITEMS = [];
  let r0;
  VERSIONS.forEach(v => {
    root.insertAdjacentHTML('beforeend', `<h3>${v.label}<span>${v.desc}</span></h3><div class="grid"></div>`);
    const grid = root.lastElementChild;
    plans.forEach(p => {
      st.plan = p.id; st.weights[p.id] = {...p.w};
      const r = api.compute(); r0 = r0 || r;
      const cell = D.createElement('div'); cell.className = 'cell';
      const el = D.createElement('div'); el.className = 'slide' + (v.theme === 'navy' ? ' navy' : '');
      el.innerHTML = api.slideHTML(p, r, {...v, report: true});
      cell.appendChild(el); grid.appendChild(cell);
      ITEMS.push({el, r, p, v});
    });
  });
  // stretchTable วัดที่ขนาดจริง ก่อนย่อ
  ITEMS.forEach(it => { it.el.style.transform = 'none'; api.stretchTable(it.el); });
  scale();
  $('sub').innerHTML = `ข้อมูล <b>${thDate(r0.start)} – ${thDate(r0.end)}</b>  ไทยและอังกฤษ พื้นขาวและกรมท่า รวม ${ITEMS.length} สไลด์`;
  $('go').disabled = false; $('go10').disabled = false;
}

/* แบบ 10 ล้าน: เฉพาะพื้นขาว (P และ ENP) ใส่ Portfolio Value 10 ล้านบาท และจำนวนเงินของแต่ละโมเดลตามสัดส่วน */
const AMOUNT = 10;
async function download(withAmount){
  const api = W.WPAPI, btn = $(withAmount ? 'go10' : 'go');
  if (!W.PptxGenJS){ $('msg').textContent = 'โหลดตัวช่วยสร้าง PowerPoint ไม่สำเร็จ ลองรีเฟรชหน้า'; return; }
  btn.disabled = true; $('msg').textContent = 'กำลังสร้างไฟล์…';
  try{
    const pptx = new W.PptxGenJS(); pptx.layout = 'LAYOUT_WIDE';
    const lotus = {white: await api.svgToPNG(api.BRAND.lotus, 148, 200),
                   navy: await api.svgToPNG(api.BRAND.lotus.replace(/#C10230/g, '#ffffff'), 148, 200)};
    const vers = withAmount ? VERSIONS.filter(v => v.theme === 'white') : VERSIONS;
    vers.forEach(v => pptx.addSection({title: v.label}));
    for (const it of ITEMS.filter(it => vers.includes(it.v))){
      await api.addPlanSlide(pptx, it.el, it.r, it.p, {...it.v, report: true, section: it.v.label, amount: withAmount ? AMOUNT : 0}, lotus[it.v.theme]);
    }
    const end = ITEMS[0].r.end;
    const blob = await api.goldTextGradient(await pptx.write({outputType: 'arraybuffer'}), pptx._goldHL, pptx._repChart);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Wealth Solution Plan${withAmount ? ' พื้นขาว 10 ล้านบาท' : ''} ข้อมูลถึง ${thDate(end)}.pptx`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    $('msg').textContent = '';
  }catch(e){ console.error(e); $('msg').textContent = 'สร้างไฟล์ไม่สำเร็จ: ' + (e.message || e); }
  btn.disabled = false;
}

frame.addEventListener('load', async () => {
  const api = await waitReady();
  if (!api || !api.ready()){ $('sub').textContent = ''; $('empty').hidden = false; frame.hidden = true; return; }
  setup(api);
});
// โหลดหน้า Wealth Solution Plan ใหม่ทุกครั้ง ไม่ใช้ของที่เบราว์เซอร์เก็บไว้ ไม่งั้นโค้ดสร้างสไลด์อาจเป็นรุ่นเก่ากว่าหน้านี้
frame.src = '../?v=' + Date.now();
$('go').onclick = () => download(false);
$('go10').onclick = () => download(true);
</script>
</body>
</html>
