<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ค้นหาด้วย Master Fund | UTFIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .mf-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:52px 0 0}
  .mf-h h1{font-size:44px;line-height:1.1;letter-spacing:-.03em}
  .mf-h .asof{font-size:13.5px;color:var(--mute);white-space:nowrap}

  /* ช่องค้นหาแบบชิป */
  .search{position:relative;margin-top:24px}
  .box{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);cursor:text}
  .box:focus-within{border-color:var(--p);box-shadow:0 0 0 4px var(--p-50),var(--shadow)}
  .box > svg{flex:none;color:var(--mute)}
  .tok{display:inline-flex;align-items:center;gap:8px;background:var(--p);color:#fff;border-radius:11px;padding:6px 8px 6px 12px;font-weight:600;font-size:14.5px}
  .tok small{font-weight:500;opacity:.7}
  .tok button{border:0;background:rgba(255,255,255,.18);color:#fff;width:22px;height:22px;border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:13px}
  .tok button:hover{background:rgba(255,255,255,.32)}
  .box input{flex:1;min-width:220px;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--ink);padding:6px 4px}
  .box input::placeholder{color:var(--mute)}
  .dd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:16px;
      box-shadow:0 18px 44px rgba(15,26,60,.16);max-height:min(460px,60vh);overflow:auto;padding:6px 0}
  .dd .g{padding:10px 18px 4px;font-size:12.5px;font-weight:600;color:var(--mute)}
  .dd .o{display:flex;justify-content:space-between;gap:12px;padding:9px 18px;cursor:pointer}
  .dd .o[aria-selected=true]{background:var(--p-50)}
  .dd .o b{font-weight:600}
  .dd .o span{color:var(--mute);font-size:13.5px;white-space:nowrap}
  .dd .none{padding:14px 18px;color:var(--mute)}
  mark{background:#ffe9a8;color:inherit;border-radius:3px}

  .quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
  .quick .l{font-size:14px;color:var(--mute);margin-right:4px}
  .q{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 13px;cursor:pointer;transition:border-color .15s}
  .q:hover{border-color:var(--p)}
  .q small{color:var(--mute);margin-left:4px}
  .q.on{background:var(--p-50);border-color:var(--p-200)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .seg{display:flex;flex-wrap:wrap;background:var(--p-50);border-radius:13px;padding:4px}
  .seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink-2);padding:6px 13px;border-radius:10px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,26,60,.12)}

  /* ผลลัพธ์ */
  .res{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 28px}
  .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .rh h2{font-size:26px;line-height:1.25}
  .rh .ms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .rh .ms span{font-size:13.5px;background:var(--p-50);color:var(--ink-2);border-radius:8px;padding:2px 10px}
  .badge{white-space:nowrap;background:#e8edff;color:#2f56ff;border-radius:11px;padding:6px 14px;font-weight:700}
  html[data-theme=dark] .badge{background:#16214a;color:#9cc6ff}
  .tw{overflow-x:auto;margin-top:16px}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th{font-size:13px;font-weight:500;color:var(--mute);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th[data-k]{cursor:pointer;user-select:none}
  th[data-k]:hover{color:var(--ink)}
  th.on{color:var(--ink);font-weight:600}
  th.on::after{content:" ↓"}
  th.on.asc::after{content:" ↑"}
  th.n,td.n{text-align:right}
  td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover td{background:var(--p-50)}
  td .nm{font-weight:700;font-size:15.5px}
  td .th{font-size:12.5px;color:var(--mute);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:5px;margin-top:4px}
  .tg{font-size:11.5px;background:var(--p-50);color:var(--ink-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .pill{font-size:12.5px;border-radius:7px;padding:2px 9px;white-space:nowrap;background:var(--p-50);color:var(--ink-2)}
  .fx0{background:#fff3e0;color:#b26a00} .fx2{background:#e7f7ef;color:#0b7a4b}
  html[data-theme=dark] .fx0{background:#3a2a10;color:#ffc46b} html[data-theme=dark] .fx2{background:#0f3326;color:#5fe0a8}
  td.n{font-variant-numeric:tabular-nums;font-weight:600}
  .pos{color:var(--ok)} .neg{color:var(--red)} .na{color:var(--mute);font-weight:400}
  td.mcol{white-space:nowrap;color:var(--ink-2);font-size:14px}
  td.ck{width:34px} td.ck input{width:16px;height:16px;cursor:pointer}
  .rf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;color:var(--mute);font-size:13.5px;flex-wrap:wrap}
  .btn-p{font:inherit;font-weight:600;font-size:14.5px;border:0;border-radius:12px;padding:10px 18px;background:var(--p);color:#fff;cursor:pointer;text-decoration:none}
  .btn-p[aria-disabled=true]{opacity:.4;pointer-events:none}
  .more{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer}

  /* ยังไม่ได้เลือก: รายการ master fund */
  .ml td .nm{font-size:15px}
  .ml tbody tr{cursor:pointer}
  .cnt{font-weight:700;color:#2f56ff}
  html[data-theme=dark] .cnt{color:#7db4ff}
  .empty{padding:40px 0;text-align:center;color:var(--mute)}
  @media (max-width:720px){.mf-h{flex-direction:column;align-items:flex-start}.mf-h h1{font-size:34px}.res{padding:20px 16px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="mf-h"><h1>Master Fund Search</h1><div class="asof" id="asof"></div></header>

  <div class="search">
    <div class="box" id="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span id="toks"></span>
      <input id="q" autocomplete="off" placeholder="ชื่อ master fund ชื่อกองไทย ดัชนี หรือประเทศ" role="combobox" aria-expanded="false" aria-controls="dd">
    </div>
    <div class="dd" id="dd" role="listbox" hidden></div>
  </div>
  <div class="quick" id="quick"></div>

  <div class="filters">
    <div class="seg" id="fAsset"></div>
    <div class="seg" id="fMgmt"></div>
    <div class="seg" id="fFx"></div>
  </div>

  <section class="res" id="res"></section>
  <footer class="foot">ข้อมูลกองทุนจาก SEC Open API ผลตอบแทน 1 ปีคำนวณจาก NAV ไม่รวมค่าธรรมเนียมซื้อขาย ผลการดำเนินงานในอดีตไม่ได้เป็นสิ่งยืนยันถึงผลการดำเนินงานในอนาคต</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = UI.esc, pct = UI.pct;
const BASE = UTFIT_SRC.masterfund;           // funds_data.json, amc_abbr.csv, master_tags.csv
const SUMMARY_URL = "../../atf/compare/data/summary.json";

/* ---------- ข้อมูล ---------- */
let MASTERS = new Map();   // name -> {name, tags, rows:[fund rows]}
let FUNDS = [];            // แถวละกอง (รวม class)
let SUM = {funds: {}};
const ASSET = [["", "ทุกประเภท"], ["Equity", "หุ้น"], ["Fixed Income", "ตราสารหนี้"], ["Commodity", "ทองคำ/สินค้าโภคภัณฑ์"], ["Multi-Asset", "ผสม"], ["Real Estate", "อสังหาฯ"], ["Alternative", "ทางเลือก"]];
const MGMT = [["", "ทุกกลยุทธ์"], ["Active", "Active"], ["Passive", "Passive"]];
const FX = [["", "ทุกแบบ"], ["hedged", "ป้องกันทั้งหมด"], ["dynamic", "ดุลยพินิจ"], ["none", "ไม่ป้องกัน"]];
const TH_COUNTRY = {"United States": "สหรัฐฯ", "Japan": "ญี่ปุ่น", "China": "จีน", "India": "อินเดีย", "Vietnam": "เวียดนาม", "Taiwan": "ไต้หวัน", "Korea": "เกาหลีใต้", "South Korea": "เกาหลีใต้", "Indonesia": "อินโดนีเซีย", "Hong Kong": "ฮ่องกง", "Germany": "เยอรมนี", "United Kingdom": "อังกฤษ", "Europe": "ยุโรป", "Brazil": "บราซิล"};
const QUICK = [
  {kind: "index", v: "S&P 500"}, {kind: "index", v: "Nasdaq-100"}, {kind: "index", v: "MSCI ACWI"}, {kind: "index", v: "Gold spot (LBMA)", label: "ทองคำ"},
  {kind: "country", v: "India"}, {kind: "country", v: "Vietnam"}, {kind: "country", v: "Japan"}, {kind: "country", v: "China"},
  {kind: "theme", v: "Technology"}, {kind: "theme", v: "Semiconductor"},
];

function csvParse(text) {
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const h = rows.shift();
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(h.map((k, i) => [k.trim(), (r[i] || "").trim()])));
}
const norm = s => String(s || "").replace(/\s+/g, " ").replace("จัดการกองทุนรวม", "จัดการกองทุน").trim();
const fxKind = s => { s = s || ""; if (/ไม่ป้องกัน|unhedged/i.test(s)) return "none"; if (/ทั้งหมด|fully/i.test(s)) return "hedged"; if (/ดุลยพินิจ|dynamic/i.test(s)) return "dynamic"; if (/ระดับชนิด/.test(s)) return "class"; return ""; };
const FX_LABEL = {none: "ไม่ป้องกัน", hedged: "ป้องกันทั้งหมด", dynamic: "ดุลยพินิจ", class: "แยกตาม class", "": "–"};
const FX_CLS = {none: "fx0", hedged: "fx2"};
const label = t => t.label || (t.kind === "country" ? (TH_COUNTRY[t.v] || t.v) : t.v);
const KIND_TH = {index: "ดัชนี", country: "ประเทศ", theme: "ธีม", master: "Master fund"};

async function load() {
  const [fd, amcT, tagT, sum] = await Promise.all([
    fetch(BASE + "funds_data.json", {cache: "no-cache"}).then(r => r.json()),
    fetch(BASE + "amc_abbr.csv", {cache: "no-cache"}).then(r => r.ok ? r.text() : "").catch(() => ""),
    fetch(BASE + "master_tags.csv", {cache: "no-cache"}).then(r => r.ok ? r.text() : "").catch(() => ""),
    fetch(SUMMARY_URL, {cache: "no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  SUM = sum || {funds: {}};
  const AMC = new Map(csvParse(amcT).map(r => [norm(r.name_th), r.abbr]));
  const amcOf = n => AMC.get(norm(n)) || AMC.get(norm(n) + " จำกัด") || norm(n).replace(/^บริษัทหลักทรัพย์จัดการกองทุน(รวม)?\s*/, "").replace(/\s*จำกัด.*$/, "");
  const TAGS = new Map(csvParse(tagT).map(r => [r.master_fund, r]));
  // รวม class ของโครงการเดียวกัน (ต่อ master) เป็นกองเดียว
  const byProj = new Map();
  for (const r of fd) {
    const k = r.proj_id + "|" + r.Master_Fund_Search;
    if (!byProj.has(k)) byProj.set(k, []);
    byProj.get(k).push(r);
  }
  FUNDS = [];
  for (const cls of byProj.values()) {
    const names = cls.map(c => c.Search_Name || c.proj_abbr_name);
    const main = names.find(n => SUM.funds[n]) || names[0];
    const r0 = cls.find(c => (c.Search_Name || c.proj_abbr_name) === main) || cls[0];
    const s = SUM.funds[main] || [null, null];
    const tag = TAGS.get(r0.Master_Fund_Search) || {};
    const mg = {AN: "Active", AM: "Active", PN: "Passive", PM: "Passive"}[r0.management_style] || tag.mgmt || "";
    FUNDS.push({
      name: main, abbr: r0.proj_abbr_name, th: r0.proj_name_th, amc: amcOf(r0.comp_name_th),
      master: r0.Master_Fund_Search, mgmt: mg, fx: fxKind(r0.exchange_rate_protection_policy), fxFull: r0.exchange_rate_protection_policy || "",
      ncls: cls.length, ssf: cls.some(c => /SSF/.test(c.fund_class_tax_incentive_type || "")) || /RMF|SSF|ESG/.test(names.join(" ")),
      r1y: s[0], ter: s[1], asset: tag.asset || "",
    });
  }
  MASTERS = new Map();
  for (const f of FUNDS) {
    if (!MASTERS.has(f.master)) MASTERS.set(f.master, {name: f.master, tags: TAGS.get(f.master) || {}, funds: []});
    MASTERS.get(f.master).funds.push(f);
  }
  $("asof").textContent = SUM.nav_to ? `ผลตอบแทนและค่าใช้จ่าย ณ ${UI.thDate(SUM.nav_to)}` : "";
}

/* ---------- สถานะ ---------- */
const S = {toks: [], asset: "", mgmt: "", fx: "", sort: {k: "r1y", asc: false}, picked: new Set(), show: 30, msort: "n"};
const listOf = (tag, k) => String(tag[k] || "").split(";").map(x => x.trim()).filter(Boolean);
function masterMatches(m, t) {
  const g = m.tags;
  if (t.kind === "master") return m.name === t.v;
  if (t.kind === "index") return listOf(g, "index").includes(t.v);
  if (t.kind === "theme") return listOf(g, "theme").includes(t.v) || listOf(g, "sector").includes(t.v);
  if (t.kind === "country") return listOf(g, "countries").includes(t.v);
  return false;
}
const selMasters = () => [...MASTERS.values()].filter(m => S.toks.some(t => masterMatches(m, t)));
const passFilters = f => (!S.asset || f.asset === S.asset) && (!S.mgmt || f.mgmt === S.mgmt) && (!S.fx || f.fx === S.fx);

/* ---------- ค้นหา ---------- */
let opts = [], act = -1;
function suggest(q) {
  const n = q.trim().toLowerCase(); if (!n) return [];
  const has = s => String(s || "").toLowerCase().includes(n);
  const groups = [];
  const idx = new Map(), ctry = new Map(), thm = new Map();
  for (const m of MASTERS.values()) {
    for (const v of listOf(m.tags, "index")) idx.set(v, (idx.get(v) || 0) + m.funds.length);
    for (const v of listOf(m.tags, "countries")) ctry.set(v, (ctry.get(v) || 0) + m.funds.length);
    for (const v of [...listOf(m.tags, "theme"), ...listOf(m.tags, "sector")]) thm.set(v, (thm.get(v) || 0) + m.funds.length);
  }
  const pick = (map, kind) => [...map].filter(([v]) => has(v) || has(kind === "country" ? TH_COUNTRY[v] : "")).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([v, c]) => ({kind, v, c}));
  const add = (g, arr) => { if (arr.length) groups.push([g, arr]); };
  add("ดัชนี", pick(idx, "index"));
  add("ประเทศ", pick(ctry, "country"));
  add("ธีม", pick(thm, "theme"));
  add("Master fund", [...MASTERS.values()].filter(m => has(m.name)).sort((a, b) => b.funds.length - a.funds.length).slice(0, 6).map(m => ({kind: "master", v: m.name, c: m.funds.length})));
  add("กองทุนไทย", FUNDS.filter(f => has(f.name) || has(f.abbr) || has(f.th)).slice(0, 6).map(f => ({kind: "master", v: f.master, c: null, fund: f.name})));
  return groups;
}
function hl(s, q) { const i = s.toLowerCase().indexOf(q.toLowerCase()); return i < 0 || !q ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); }
function renderDD() {
  const q = $("q").value, groups = suggest(q), dd = $("dd");
  opts = []; act = -1;
  if (!q.trim()) { dd.hidden = true; $("q").setAttribute("aria-expanded", "false"); return; }
  dd.innerHTML = groups.length ? groups.map(([g, arr]) => `<div class="g">${g}</div>` + arr.map(o => {
    const i = opts.push(o) - 1;
    const main = o.fund ? hl(o.fund, q) : hl(label(o), q);
    const sub = o.fund ? esc(o.v) : o.c != null ? `${o.c} กองไทย` : "";
    return `<div class="o" role="option" data-i="${i}"><b>${main}</b><span>${sub}</span></div>`;
  }).join("")).join("") : `<div class="none">ไม่พบ "${esc(q)}"</div>`;
  dd.hidden = false; $("q").setAttribute("aria-expanded", "true");
}
function addTok(t) {
  if (!S.toks.some(x => x.kind === t.kind && x.v === t.v)) S.toks.push({kind: t.kind, v: t.v, label: t.label});
  $("q").value = ""; $("dd").hidden = true; S.show = 30; render();
}
$("q").addEventListener("input", renderDD);
$("q").addEventListener("keydown", e => {
  const items = [...$("dd").querySelectorAll(".o")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    act = (act + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((x, i) => x.setAttribute("aria-selected", i === act)); items[act].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") { e.preventDefault(); const o = opts[act >= 0 ? act : 0]; if (o) addTok(o); }
  else if (e.key === "Escape") { $("dd").hidden = true; }
  else if (e.key === "Backspace" && !$("q").value && S.toks.length) { S.toks.pop(); render(); }
});
$("dd").addEventListener("mousedown", e => { const o = e.target.closest(".o"); if (o) { e.preventDefault(); addTok(opts[+o.dataset.i]); } });
$("q").addEventListener("blur", () => setTimeout(() => $("dd").hidden = true, 120));
$("box").addEventListener("click", e => { if (!e.target.closest("button")) $("q").focus(); });
$("toks").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { S.toks.splice(+b.dataset.i, 1); render(); } });

/* ---------- แสดงผล ---------- */
function seg(id, list, key) {
  $(id).innerHTML = list.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join("");
  $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; S[key] = b.dataset.v; S.show = 30; render(); };
}
function renderQuick() {
  const cnt = t => [...MASTERS.values()].filter(m => masterMatches(m, t)).reduce((a, m) => a + m.funds.length, 0);
  const lead = S.toks.length ? "เพิ่ม" : "ยอดนิยม";
  $("quick").innerHTML = `<span class="l">${lead}</span>` + QUICK.filter(t => !S.toks.some(x => x.kind === t.kind && x.v === t.v)).map((t, i) =>
    `<button class="q" type="button" data-i="${QUICK.indexOf(t)}">${S.toks.length ? "+ " : ""}${esc(label(t))}<small>${cnt(t)}</small></button>`).join("");
}
$("quick").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) addTok(QUICK[+b.dataset.i]); });

const cell = {
  r1y: f => f.r1y == null ? `<td class="n na">–</td>` : `<td class="n ${f.r1y >= 0 ? "pos" : "neg"}">${pct(f.r1y)}</td>`,
  ter: f => f.ter == null ? `<td class="n na">–</td>` : `<td class="n">${f.ter.toFixed(2)}%</td>`,
};
function sortFunds(arr) {
  const {k, asc} = S.sort, dir = asc ? 1 : -1;
  return arr.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir || a.name.localeCompare(b.name);
  });
}
function th(k, t, n) { const on = S.sort.k === k; return `<th data-k="${k}" class="${n ? "n " : ""}${on ? "on" + (S.sort.asc ? " asc" : "") : ""}">${t}</th>`; }

function renderResults() {
  const ms = selMasters();
  const funds = sortFunds(ms.flatMap(m => m.funds).filter(passFilters));
  const title = S.toks.map(t => (t.kind === "master" ? "" : KIND_TH[t.kind] + " ") + label(t)).join(" + ");
  const short = n => { n = n.replace(/\s+(UCITS\s+)?(ETF|Fund|Trust|Portfolio)(\s+Trust)?$/i, ""); return n.length > 24 ? n.slice(0, 22) + "…" : n; };
  const rows = funds.slice(0, S.show).map(f => `<tr>
    <td class="ck"><input type="checkbox" data-n="${esc(f.name)}" ${S.picked.has(f.name) ? "checked" : ""} ${SUM.funds[f.name] ? "" : "disabled title=\"ยังไม่มีข้อมูล NAV ในหน้า ATF vs รายกอง\""}></td>
    <td><div class="nm">${esc(f.name)}</div><div class="th" title="${esc(f.th)}">${esc(f.th)}</div>
      ${f.ncls > 1 || f.ssf ? `<div class="tags">${f.ncls > 1 ? `<span class="tg">+${f.ncls - 1} class</span>` : ""}${f.ssf ? `<span class="tg">มีกองภาษี</span>` : ""}</div>` : ""}</td>
    ${ms.length > 1 ? `<td class="mcol" title="${esc(f.master)}">${esc(short(f.master))}</td>` : ""}
    <td>${esc(f.amc)}</td>
    <td>${f.mgmt ? `<span class="pill">${f.mgmt}</span>` : "–"}</td>
    <td><span class="pill ${FX_CLS[f.fx] || ""}" title="${esc(f.fxFull)}">${FX_LABEL[f.fx]}</span></td>
    ${cell.r1y(f)}${cell.ter(f)}</tr>`).join("");
  $("res").innerHTML = `<div class="rh"><div><h2>${esc(title)}</h2>
      <div class="ms">${ms.slice(0, 8).map(m => `<span>${esc(m.name)}</span>`).join("")}${ms.length > 8 ? `<span>อีก ${ms.length - 8}</span>` : ""}</div></div>
      <span class="badge">${funds.length} กองไทย</span></div>
    ${funds.length ? `<div class="tw"><table><thead><tr><th></th>${th("name", "กองทุน")}${ms.length > 1 ? th("master", "Master") : ""}${th("amc", "บลจ.")}${th("mgmt", "กลยุทธ์")}${th("fx", "ป้องกันค่าเงิน")}${th("r1y", "ผลตอบแทน 1Y", 1)}${th("ter", "ค่าใช้จ่ายรวม", 1)}</tr></thead>
      <tbody>${rows}</tbody></table></div>` : `<div class="empty">ไม่มีกองที่ตรงกับตัวกรอง</div>`}
    <div class="rf"><span>${funds.length > S.show ? `<button class="more" id="more">แสดงเพิ่ม</button> ` : ""}แสดง ${Math.min(S.show, funds.length)} จาก ${funds.length} กอง</span>
      <a class="btn-p" id="cmp" aria-disabled="${S.picked.size ? "false" : "true"}">เทียบกองที่เลือก${S.picked.size ? ` (${S.picked.size})` : ""}</a></div>`;
  updCmp();
}
function renderMasterList() {
  const ms = [...MASTERS.values()].map(m => ({m, n: m.funds.filter(passFilters).length})).filter(x => x.n)
    .sort((a, b) => S.msort === "name" ? a.m.name.localeCompare(b.m.name) : b.n - a.n);
  const tagline = g => [g.index && "ดัชนี " + g.index, g.theme, g.region].filter(Boolean).slice(0, 2).join(" / ");
  $("res").innerHTML = `<div class="rh"><div><h2>Master fund ทั้งหมด</h2></div><span class="badge">${ms.length} master fund</span></div>
    <div class="tw"><table class="ml"><thead><tr><th>Master fund</th><th>ประเภท</th><th>ดัชนี / ธีม</th><th class="n">กองไทย</th></tr></thead><tbody>
    ${ms.slice(0, S.show).map(({m, n}) => `<tr data-m="${esc(m.name)}"><td><div class="nm">${esc(m.name)}</div></td>
      <td>${m.tags.asset ? `<span class="pill">${esc((ASSET.find(a => a[0] === m.tags.asset) || [0, m.tags.asset])[1])}</span>` : "–"}</td>
      <td class="th">${esc(tagline(m.tags)) || "–"}</td><td class="n"><span class="cnt">${n}</span></td></tr>`).join("")}
    </tbody></table></div>
    <div class="rf"><span>${ms.length > S.show ? `<button class="more" id="more">แสดงเพิ่ม</button> ` : ""}แสดง ${Math.min(S.show, ms.length)} จาก ${ms.length}</span></div>`;
}
function updCmp() {
  const a = $("cmp"); if (!a) return;
  const names = [...S.picked].slice(0, 8);
  a.href = "../../atf/compare/#f=" + names.map(encodeURIComponent).join("|") + "&q=1Y";
  a.setAttribute("aria-disabled", names.length ? "false" : "true");
  a.textContent = "เทียบกองที่เลือก" + (names.length ? ` (${names.length})` : "");
}
$("res").addEventListener("click", e => {
  const h = e.target.closest("th[data-k]");
  if (h) { const k = h.dataset.k; S.sort = {k, asc: S.sort.k === k ? !S.sort.asc : !["r1y"].includes(k)}; renderResults(); return; }
  if (e.target.id === "more") { S.show += 50; render(); return; }
  const r = e.target.closest("tr[data-m]");
  if (r) addTok({kind: "master", v: r.dataset.m});
});
$("res").addEventListener("change", e => {
  const c = e.target.closest("input[data-n]"); if (!c) return;
  if (c.checked) { if (S.picked.size >= 8) { c.checked = false; return; } S.picked.add(c.dataset.n); } else S.picked.delete(c.dataset.n);
  updCmp();
});
function render() {
  $("toks").innerHTML = S.toks.map((t, i) => `<span class="tok">${t.kind === "master" ? "" : `<small>${KIND_TH[t.kind]}</small>`}${esc(label(t))}<button type="button" data-i="${i}" aria-label="เอาออก">✕</button></span>`).join("");
  $("q").placeholder = S.toks.length ? "เพิ่ม master fund ดัชนี หรือประเทศ" : "ชื่อ master fund ชื่อกองไทย ดัชนี หรือประเทศ";
  seg("fAsset", ASSET, "asset"); seg("fMgmt", MGMT, "mgmt"); seg("fFx", FX, "fx");
  renderQuick();
  if (S.toks.length) renderResults(); else renderMasterList();
  try { history.replaceState(null, "", S.toks.length ? "#" + S.toks.map(t => t.kind + ":" + encodeURIComponent(t.v)).join("|") : location.pathname); } catch (e) {}
}
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  for (const part of h.split("|")) { const i = part.indexOf(":"); if (i > 0) S.toks.push({kind: part.slice(0, i), v: part.slice(i + 1)}); }
}
(async () => {
  $("res").innerHTML = `<div class="empty">กำลังโหลดข้อมูล…</div>`;
  try { await load(); } catch (e) { $("res").innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>`; return; }
  fromHash(); render();
})();
</script>
</body>
</html>
